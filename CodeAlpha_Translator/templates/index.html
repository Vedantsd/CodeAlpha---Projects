<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingua — Translate</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-grid"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">語</span>
      <span class="brand-name">Lingua</span>
    </div>
    <p class="tagline">Speak it. Read it. Anywhere.</p>
  </header>

  <main class="stage">
    <section class="panel panel--source">
      <div class="panel-head">
        <span class="eyebrow">Source</span>
        <select id="sourceLangLabel" class="lang-pill" disabled>
          <option>Auto-detect</option>
        </select>
      </div>
      <textarea id="sourceText" class="text-area" placeholder="Type or paste text to translate…" maxlength="2000"></textarea>
      <div class="panel-foot">
        <span id="charCount" class="char-count">0 / 2000</span>
        <button id="clearBtn" class="ghost-btn" type="button">Clear</button>
      </div>
    </section>

    <div class="swap-rail">
      <button id="translateBtn" class="translate-btn" type="button">
        <span class="translate-btn-arrow">→</span>
        <span class="translate-btn-text">Translate</span>
      </button>
    </div>

    <section class="panel panel--target">
      <div class="panel-head">
        <span class="eyebrow">Target</span>
        <select id="targetLang" class="lang-pill">
          {% for code, name in languages.items() %}
            <option value="{{ code }}" {% if code == 'es-ES' %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <div id="resultBox" class="text-area result-box" aria-live="polite">
        <span class="placeholder">Your translation will appear here.</span>
      </div>
      <div class="panel-foot">
        <span id="statusMsg" class="status-msg"></span>
        <button id="copyBtn" class="ghost-btn" type="button">Copy</button>
      </div>
    </section>
  </main>

  <footer class="footer-note">
    Translations powered by the Murf API.
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
